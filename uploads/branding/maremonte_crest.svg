<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4B4B"/>
      <stop offset="100%" stop-color="#0E2D2D"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D728F"/>
      <stop offset="100%" stop-color="#1A4B4B"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="200" cy="200" r="190" fill="#FCFAF7" stroke="url(#goldGrad)" stroke-width="4" filter="url(#subtleGlow)"/>
  <circle cx="200" cy="200" r="182" fill="none" stroke="#1A4B4B" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="200" cy="200" r="145" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Curved Text Paths -->
  <!-- Top Arc for HOTEL MARE & MONTE BISTRO -->
  <path id="topArc" d="M 45,200 A 155,155 0 0,1 355,200" fill="none"/>
  <!-- Bottom Arc for ALTINOLUK • EST. 1985 -->
  <path id="bottomArc" d="M 355,200 A 155,155 0 0,1 45,200" fill="none"/>

  <text fill="#1A4B4B" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="16.5" font-weight="700" letter-spacing="3.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      HOTEL MARE &amp; MONTE BISTRO
    </textPath>
  </text>

  <text fill="#AA7C11" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="700" letter-spacing="4">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      ★ ALTINOLUK • EST. 1985 ★
    </textPath>
  </text>

  <!-- Decorative Olive Branch Left -->
  <g transform="translate(115, 200) rotate(-40) scale(0.6)" fill="#1A4B4B" opacity="0.85">
    <path d="M0,0 Q-15,-25 0,-50 Q15,-25 0,0"/>
    <path d="M-10,-20 Q-35,-25 -30,-45 Q-10,-35 -10,-20"/>
    <path d="M10,-25 Q35,-30 30,-50 Q10,-40 10,-25"/>
  </g>

  <!-- Decorative Olive Branch Right -->
  <g transform="translate(285, 200) rotate(40) scale(0.6)" fill="#1A4B4B" opacity="0.85">
    <path d="M0,0 Q-15,-25 0,-50 Q15,-25 0,0"/>
    <path d="M-10,-20 Q-35,-25 -30,-45 Q-10,-35 -10,-20"/>
    <path d="M10,-25 Q35,-30 30,-50 Q10,-40 10,-25"/>
  </g>

  <!-- Center Artwork Disc -->
  <g transform="translate(200, 195)">
    <!-- Inner Background -->
    <circle cx="0" cy="0" r="85" fill="#F4EFE6" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <g clip-path="url(#innerClip)">
      <clipPath id="innerClip">
        <circle cx="0" cy="0" r="83"/>
      </clipPath>

      <!-- Sun Rays -->
      <g stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6">
        <line x1="0" y1="-25" x2="0" y2="-65"/>
        <line x1="0" y1="-25" x2="25" y2="-60"/>
        <line x1="0" y1="-25" x2="-25" y2="-60"/>
        <line x1="0" y1="-25" x2="45" y2="-45"/>
        <line x1="0" y1="-25" x2="-45" y2="-45"/>
      </g>
      <!-- Sun Disk -->
      <circle cx="0" cy="-25" r="22" fill="url(#goldGrad)"/>

      <!-- Mount Ida (Kazdağı / Monte) Peaks -->
      <!-- Back Peak -->
      <polygon points="15,-10 65,45 -35,45" fill="#3D6B65" opacity="0.8"/>
      <!-- Main Peak -->
      <polygon points="-20,-20 35,50 -75,50" fill="#1A4B4B"/>
      <!-- Snow/Highlight on Main Peak -->
      <polygon points="-20,-20 -9,-3 -31,3" fill="#FAF8F5" opacity="0.9"/>
      
      <!-- Aegean Sea Waves (Mare) -->
      <!-- Wave 1 (Back) -->
      <path d="M-90,25 C-60,15 -30,35 0,25 C30,15 60,35 90,25 L90,90 L-90,90 Z" fill="#245A6E" opacity="0.8"/>
      <!-- Wave 2 (Middle) -->
      <path d="M-90,40 C-60,30 -30,50 0,40 C30,30 60,50 90,40 L90,90 L-90,90 Z" fill="url(#seaGrad)"/>
      <!-- Wave 3 (Front) -->
      <path d="M-90,55 C-60,48 -30,62 0,55 C30,48 60,62 90,55 L90,90 L-90,90 Z" fill="#143636"/>

      <!-- Subtle Wave Foam Lines -->
      <path d="M-80,26 C-55,18 -25,36 5,26 C35,16 65,36 85,26" fill="none" stroke="#FAF8F5" stroke-width="1.5" opacity="0.75"/>
      <path d="M-85,41 C-55,32 -25,51 5,41 C35,31 65,51 85,41" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.8"/>
    </g>

    <!-- Olive Sprig Icon on bottom center -->
    <g transform="translate(0, 58) scale(0.45)" fill="url(#goldGrad)">
      <path d="M0,0 C-10,-12 -25,-8 -25,10 C-10,12 0,0 0,0 Z"/>
      <path d="M0,0 C10,-12 25,-8 25,10 C10,12 0,0 0,0 Z"/>
      <circle cx="0" cy="5" r="4"/>
    </g>
  </g>
</svg>
